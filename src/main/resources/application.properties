# application.properties
# ============================================
# NOMBRE DE LA APLICACIÓN
# ============================================
spring.application.name=pixelplayback

# ============================================
# CONEXIÓN A MYSQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/pixelplaydb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURACIÓN JWT
# ============================================
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
server.port=8080

# ============================================
# LOGGING
# ============================================
logging.level.org.springframework.security=DEBUG
logging.level.com.pixelplay=DEBUG

# ============================================
# SPRING ACTUATOR + PROMETHEUS
# ============================================
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
# management.server.port=8081   # opcional, si quieres separar puerto
