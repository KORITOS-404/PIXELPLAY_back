version: '3.8'

# NOTA: Este archivo asume que tu backend de Spring Boot (pixelplayback) está
# corriendo directamente en el host en http://localhost:8080.

services:
  # ==================================
  # 1. PROMETHEUS
  # ==================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Monta el archivo de configuración de Prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Almacena los datos de la base de tiempo (TSDB)
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  # ==================================
  # 2. GRAFANA
  # ==================================
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    # El password por defecto es admin:admin
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Monta el volumen para persistencia de configuración y dashboards
      - grafana_data:/var/lib/grafana

  # ==================================
  # 3. MySQL (Si lo tienes en Docker)
  # Este servicio se incluye solo para corregir la sintaxis de 'volumes'.
  # Si ya estás usando MySQL en tu host (como parece por el puerto 3307),
  # puedes eliminar este bloque. Si lo dejas, usaría el puerto 3306.
  # ==================================
  # mysql:
  #   image: mysql:8.0
  #   container_name: mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: 123456
  #     MYSQL_DATABASE: pixelplaydb
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     # La sintaxis debe ser un array (lista con guiones)
  #     - mysql_data:/var/lib/mysql

volumes:
  prometheus_data:
  grafana_data:
  # mysql_data: # Descomentar si usas el servicio mysql arriba